services:
  postgres:
    image: postgres:17
    container_name: audioverse-postgres
    environment:
      POSTGRES_DB: audioverse
      POSTGRES_USER: audioverse_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audioverse_user -d audioverse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
